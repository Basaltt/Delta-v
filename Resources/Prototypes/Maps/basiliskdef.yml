- type: gameMap
  id: Basilisk
  mapName: 'Basilisk'
  mapPath: /Maps/basilisk.yml
  minPlayers: 30
  maxPlayers: 100
  stations:
    Basilisk:
      stationProto: StandardNanotrasenStation
      components:
        - type: StationNameSetup
          mapNameTemplate: '{0} Basilisk Station {1}'
          nameGenerator:
            !type:NanotrasenNameGenerator
            prefixCreator: 'NTDV'
        - type: StationEmergencyShuttle
          emergencyShuttlePath: /Maps/_DV/Shuttles/NTES_UCLB.yml
        - type: StationCargoShuttle
          path: /Maps/_DV/Shuttles/NTCS_Duster.yml
        - type: StationJobs
          availableJobs:
          #civilian
            Passenger: [ -1, -1 ]
            #Librarian: [ 1, 1 ]
          #command
            Captain: [ 1, 1 ]
            #StationAi: [ 1, 1 ]
          #engineering
            #AtmosphericTechnician: [ 1, 3 ]
            #ChiefEngineer: [ 1, 1 ]
            #StationEngineer: [ 2, 3 ]
            #TechnicalAssistant: [ 2, 3 ]
          #justice
            #ChiefJustice: [ 1, 1 ]
            #Clerk: [ 1, 1 ]
            #Lawyer: [ 2, 2 ]
            #Prosecutor: [ 1, 1 ]
          #medical
            #Chemist: [ 2, 2 ]
            #ChiefMedicalOfficer: [ 1, 1 ]
            #MedicalDoctor: [ 3, 4 ]
            #MedicalIntern: [ 2, 3 ]
            #Paramedic: [ 1, 2 ]
            #Psychologist: [ 1, 1 ]
            #Surgeon: [ 1, 2 ]
          #security
            #Brigmedic: [ 1, 1 ]
            #Detective: [ 1, 1 ]
            #HeadOfSecurity: [ 1, 1 ]
            #Prisoner: [ 2, 3 ]
            #PrisonGuard: [ 1, 1 ]
            #SecurityOfficer: [ 5, 7 ]
            #SecurityCadet: [ 2, 3 ]
            #Warden: [ 1, 1 ]
          #service
            #Bartender: [ 1, 2 ]
            #Botanist: [ 2, 2 ]
            #Chef: [ 2, 2 ]
            #Clown: [ 1, 1 ]
            #HeadOfPersonnel: [ 1, 1 ]
            #Janitor: [ 2, 3 ]
            #Mime: [ 1, 1 ]
            #Musician: [ 1, 1 ]
            #Reporter: [ 2, 2 ]
            #ServiceWorker: [ 1, 3 ]
